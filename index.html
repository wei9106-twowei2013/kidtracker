<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>圖威成本統計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26233a; --muted:#77738a; --line:#e2dfea; --bg:#f4f3f8; --paper:#fff;
  --brand:#6b5f9e; --brand-soft:#ecE9f5;
  --quote:#cfc8e6; --invoice:#9d92c9; --paid:#4e4387;
  --over:#c0504d; --ok:#3f8a6a;
  --r-lg:14px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:var(--r-sm);font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#5a4f8a}
.btn.danger{color:var(--over)}
.btn.danger:hover{border-color:var(--over)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:13px}

/* Login */
#loginView{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:360px;background:var(--paper);border-radius:var(--r-lg);padding:32px 28px;border:1px solid var(--line)}
.login-box h1{font-size:22px;margin:0 0 4px}
.login-box p{color:var(--muted);margin:0 0 24px;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:#fff;width:100%}
.field textarea{min-height:64px;resize:vertical}
.msg{font-size:13px;margin-top:10px;min-height:1.2em}
.msg.err{color:var(--over)}
.setup-warn{background:#fff6e6;border:1px solid #f0d9a8;color:#7a5a1a;padding:10px 12px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px}

/* App shell */
header.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 24px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top h1{font-size:17px;margin:0;flex:1}
header.top .who{font-size:13px;color:var(--muted)}
main{max-width:1080px;margin:0 auto;padding:24px}

/* Overview */
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:28px}
.overview div{background:var(--paper);padding:14px 18px}
.overview span{display:block;font-size:13px;color:var(--muted)}
.overview strong{font-size:22px;font-weight:700}
.bar-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar-head h2{font-size:18px;margin:0;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}

/* Spend ruler: the signature element */
.ruler{position:relative;height:10px;background:#eceaf2;border-radius:5px;overflow:visible}
.ruler .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.ruler .f-quote{background:var(--quote)}
.ruler .f-invoice{background:var(--invoice)}
.ruler .f-paid{background:var(--paid)}
.ruler.over .f-quote{background:#e8b7b5}
.ruler .budget-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 0;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* Project rows */
.plist{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:20px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.prow:last-child{border-bottom:0}
.prow:hover{background:#faf9fd}
.prow .pname{font-weight:700;font-size:16px}
.prow .psub{font-size:13px;color:var(--muted)}
.prow .pnums{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
.prow .pfig{text-align:right;min-width:110px}
.prow .pfig strong{font-size:17px;display:block}
.prow .pfig small{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:500;margin-left:6px;vertical-align:2px}
.badge.closed{background:#eceaf0;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* Detail */
.crumb{margin-bottom:10px}
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dhead .t{flex:1;min-width:200px}
.dhead h2{font-size:24px;margin:0}
.dhead .sub{color:var(--muted);font-size:14px}
.dhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.dsum{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:24px}
.dsum .figs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.dsum .figs span{display:block;font-size:13px;color:var(--muted)}
.dsum .figs strong{font-size:20px}
.dsum .ruler{height:14px;border-radius:7px}
.dsum .ruler .fill{border-radius:7px}
.neg{color:var(--over)}
.pos{color:var(--ok)}
h3.sec{font-size:16px;margin:0 0 10px}
.tbl-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:28px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500;background:#faf9fc}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:#faf9fc}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;background:#fff}
.filters input{flex:1;min-width:160px}
.elist{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.erow{display:grid;grid-template-columns:92px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .date{font-size:13px;color:var(--muted)}
.erow .main{min-width:0}
.erow .vendor{font-weight:700}
.erow .desc{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:12px;padding:0 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.trade{color:#fff;border:0}
.tag.out{border-color:#2f6b4f;color:#2f6b4f}
.st{font-size:12px;padding:1px 8px;border-radius:10px;font-weight:500}
.st-報價{background:#f0edf8;color:#6b5f9e}
.st-已請款{background:#e5e1f3;color:#4e4387}
.st-已付款{background:var(--paid);color:#fff}
.erow .amt{text-align:right}
.erow .amt strong{display:block;font-size:16px}
.erow .amt small{font-size:12px;color:var(--muted)}
.erow .ops{display:flex;gap:2px}
.erow .ops a{font-size:13px;color:var(--brand);padding:4px 6px;text-decoration:none}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(38,35,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20}
.modal .box{background:var(--paper);border-radius:var(--r-lg);width:100%;max-width:560px;padding:24px}
.modal h3{margin:0 0 18px;font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:8px;margin-bottom:6px}
.tgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.tgrid input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.hint{font-size:12px;color:var(--muted);margin:0 0 14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
details.more summary{cursor:pointer;font-size:14px;color:var(--brand);margin-bottom:10px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--over)}


/* Notice linkage */
.link-sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.chip.warn b{color:#b26a00}
.chip.chg b{color:var(--over)}
.slist{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:28px}
.sgroup-h{display:flex;align-items:center;gap:8px;padding:9px 16px;background:#faf9fc;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.sgroup-h small{font-weight:400;color:var(--muted);font-size:12px}
.srow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.srow.missing{border-left-color:#e0a030;background:#fffcf5}
.srow.ignored{opacity:.55}
.srow .sdate{font-size:13px;color:var(--muted)}
.srow .sdesc{font-size:14px}
.srow .smeta{font-size:12px;color:var(--muted);margin-top:2px}
.srow .need{font-size:12px;color:#b26a00;margin-top:4px}
.srow .sacts{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.echips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.echip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.echip:hover{border-color:var(--brand)}
.chg{margin-top:6px;font-size:12px;background:#fdf0ef;border:1px solid #f2cfcc;color:#8a3431;border-radius:6px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chg span{flex:1;min-width:160px}
.tag.chgtag{border-color:#e5a9a6;color:var(--over)}
.tag.linked{border-color:var(--invoice);color:var(--paid)}

@media (max-width:720px){
  main{padding:16px}
  header.top{padding:12px 16px}
  header.top .who{display:none}
  .overview{grid-template-columns:1fr 1fr}
  .prow{grid-template-columns:1fr;gap:10px}
  .prow .pfig{text-align:left}
  .dsum .figs{grid-template-columns:1fr 1fr}
  .erow{grid-template-columns:1fr auto;gap:6px 12px}
  .erow .date{grid-column:1/-1}
  .erow .ops{grid-column:1/-1;justify-content:flex-end}
  .row2{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr;gap:6px}
  .srow .sacts{flex-direction:row;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<!-- Login -->
<section id="loginView">
  <form class="login-box" id="loginForm" autocomplete="on">
    <h1>圖威成本統計</h1>
    <p>登入後才能查看與編輯成本資料。</p>
    <div id="setupWarn" class="setup-warn hidden">尚未設定 Firebase。請在程式碼中的 firebaseConfig 貼上 twowei-progresstrack 的設定值。</div>
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">密碼</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" style="width:100%">登入</button>
    <div class="msg err" id="loginMsg"></div>
  </form>
</section>

<!-- App -->
<section id="appView" class="hidden">
  <header class="top">
    <h1>圖威成本統計</h1>
    <span class="who" id="whoAmI"></span>
    <button class="btn sm" data-action="export-backup" title="下載全部成本資料的 JSON 備份">匯出備份</button>
    <button class="btn sm" data-action="import-backup" title="從 JSON 備份匯入（合併模式）">匯入備份</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="btn sm" data-action="logout">登出</button>
  </header>
  <main id="main"></main>
</section>

<!-- Project modal -->
<div class="modal hidden" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
  <div class="box">
    <h3 id="pmTitle">新增專案</h3>
    <div class="field"><label for="pNoticeId">對應工作通告</label><select id="pNoticeId"></select></div>
    <p class="hint">連結後，通告中的工作項目會自動帶入對照，通告有新增或修改時也會同步顯示。</p>
    <p class="hint hidden" id="pFollow">專案名稱與狀態會跟著通告自動更新。</p>
    <div class="field"><label for="pName">專案名稱</label><input id="pName" placeholder="例：嘉博-葉王展"></div>
    <div class="row2">
      <div class="field"><label for="pStatus">狀態</label><select id="pStatus"><option>進行中</option><option>已結案</option></select></div>
      <div class="field"><label for="pBudget">總預算（含稅）</label><input id="pBudget" type="number" inputmode="numeric" min="0" placeholder="留空則使用分項合計"></div>
    </div>
    
    <details class="more" id="pTradeDetails">
      <summary>依工種設定預算</summary>
      <div class="tgrid" id="pTradeGrid"></div>
      <p class="hint" id="pTradeSum">分項合計：0</p>
    </details>
    <div class="field"><label for="pNote">備註</label><textarea id="pNote"></textarea></div>
    <div class="mfoot">
      <button class="btn" data-action="close-modal" data-target="projectModal">取消</button>
      <button class="btn primary" data-action="save-project">儲存專案</button>
    </div>
  </div>
</div>

<!-- Entry modal -->
<div class="modal hidden" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="emTitle">
  <div class="box">
    <h3 id="emTitle">新增成本項目</h3>
    <div class="field" id="eSlotField"><label for="eSlot">對應通告工項</label><select id="eSlot"></select></div>
    <div class="row2">
      <div class="field"><label for="eDate">日期</label><input id="eDate" type="date"></div>
      <div class="field"><label for="eTrade">工種</label><select id="eTrade"></select></div>
    </div>
    <div class="field"><label for="eVendor">廠商</label><input id="eVendor" list="vendorList" placeholder="例：XX木作"><datalist id="vendorList"></datalist></div>
    <div class="field"><label for="eDesc">項目內容</label><input id="eDesc" placeholder="例：展櫃製作 ×6"></div>
    <div class="row2">
      <div class="field"><label for="eAmount">金額</label><input id="eAmount" type="number" inputmode="numeric" step="1"></div>
      <div class="field"><label for="eTax">稅別</label><select id="eTax"><option value="exc">未稅（自動加 5%）</option><option value="inc">含稅</option></select></div>
    </div>
    <div class="field"><label for="eStatus">進度</label><select id="eStatus"><option>報價</option><option>已請款</option><option>已付款</option></select></div>
    <label class="check"><input type="checkbox" id="eOut"> 外包施作</label>
    <div class="field"><label for="eLink">相關檔案連結（報價單、發票）</label><input id="eLink" type="url" placeholder="https://drive.google.com/..."></div>
    <div class="field"><label for="eNote">備註</label><textarea id="eNote"></textarea></div>
    <div class="mfoot">
      <button class="btn" data-action="close-modal" data-target="entryModal">取消</button>
      <button class="btn primary" data-action="save-entry">儲存項目</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, serverTimestamp, writeBatch, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD6t7woI7dDhIU-Ta9bQJyIUcdyNOHMkV8",
  authDomain: "twowei-progresstrack.firebaseapp.com",
  projectId: "twowei-progresstrack",
  storageBucket: "twowei-progresstrack.firebasestorage.app",
  messagingSenderId: "1016966707396",
  appId: "1:1016966707396:web:1aeb01a954f8c261b7f191",
  measurementId: "G-DDGZN048K6"
};
/* 閒置多久自動登出（分鐘） */
const IDLE_MINUTES = 30;
/* 通告系統的資料位置（只讀取，不會修改通告） */
const NOTICES_COLLECTION = 'construction_notices';
const APP_CONFIG_PATH = ['app_config', 'global'];

/* 工項清單：優先使用通告系統「工項管理」的設定，讀不到才用這份預設 */
const DEFAULT_TYPES = [
  ['水電','#1AADCE'],['圖威','#E07B2A'],['文保','#EC9A9A'],['木工','#7B5E3A'],['油漆','#8E24AA'],
  ['大圖輸出','#0277BD'],['貼圖','#00897B'],['美術','#F4511E'],['多媒體','#3949AB'],['清潔','#558B2F'],
  ['燈光','#F9A825'],['文宣品','#D81B60'],['攝影','#C62828'],['腳本企劃','#9E9D24'],['展示設計','#6A4C93'],['其他','#4A7C6F']
].map(([name, color]) => ({ name, color }));
let tradeTypes = DEFAULT_TYPES;
const tradeNames = () => tradeTypes.map(t => t.name);
const tradeColor = n => tradeTypes.find(t => t.name === n)?.color || '#8a8790';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(Number(n) || 0).toLocaleString('zh-TW');
const taxed = e => e.taxIncluded ? (Number(e.amount) || 0) : Math.round((Number(e.amount) || 0) * 1.05);
const safeLink = u => /^https:\/\/[^\s"'<>]+$/i.test(u || '') ? u : '';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const ts = x => x?.toMillis?.() ?? Date.now();
const md = d => d ? d.slice(5).replace('-', '/') : '';
const range = s => s.endDate && s.endDate !== s.date ? `${md(s.date)}–${md(s.endDate)}` : md(s.date);
const plainCache = new Map();
function plain(html) {
  if (!html) return '';
  if (plainCache.has(html)) return plainCache.get(html);
  const t = (new DOMParser().parseFromString(String(html), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim();
  plainCache.set(html, t); return t;
}
const snapOf = s => ({ type: s.type || '', date: s.date || '', endDate: s.endDate || '', desc: plain(s.desc).slice(0, 300) });

/* ===== 計算 ===== */
function summarize(pid) {
  const es = entries.filter(e => e.projectId === pid);
  const s = { est: 0, inv: 0, paid: 0, byTrade: {}, count: es.length };
  for (const e of es) {
    const v = taxed(e);
    const b = s.byTrade[e.trade] ||= { est: 0, inv: 0, paid: 0 };
    s.est += v; b.est += v;
    if (e.status !== '報價') { s.inv += v; b.inv += v; }
    if (e.status === '已付款') { s.paid += v; b.paid += v; }
  }
  return s;
}

function slotChanges(e, s) {
  if (!e.slotSnap || !s) return [];
  const now = snapOf(s), was = e.slotSnap, ch = [];
  if (was.type !== now.type) ch.push(`工種 ${was.type} → ${now.type}`);
  if (was.date !== now.date || (was.endDate || '') !== now.endDate) ch.push(`日期 ${range(was)} → ${range(now)}`);
  if (was.desc !== now.desc) ch.push('工作內容已修改');
  return ch;
}

/* 專案與通告的對照狀態 */
function linkage(p) {
  const n = p?.noticeId ? notices.get(p.noticeId) : null;
  if (!n) return null;
  const slots = (Array.isArray(n.data) ? n.data : []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.order ?? 0) - (b.order ?? 0));
  const es = entries.filter(e => e.projectId === p.id);
  const bySlot = {};
  es.forEach(e => { if (e.slotId != null) (bySlot[e.slotId] ||= []).push(e); });
  const ignored = new Set(p.ignoredSlots || []);
  const ids = new Set(slots.map(s => s.id));
  let missing = 0; const changedEntries = [];
  slots.forEach(s => {
    const le = bySlot[s.id] || [];
    if (!le.length && !ignored.has(s.id)) missing++;
    le.forEach(e => { if (slotChanges(e, s).length) changedEntries.push(e); });
  });
  const orphans = es.filter(e => e.slotId != null && !ids.has(e.slotId));
  return { n, slots, bySlot, ignored, missing, changedEntries, orphans, slotById: id => slots.find(s => s.id === id) };
}
const noticeTitle = n => n?.headerCfg?.title || '（未命名通告）';

function rulerHTML(budget, s) {
  const max = Math.max(budget, s.est, 1);
  const pct = v => (v / max * 100).toFixed(2) + '%';
  const over = budget > 0 && s.est > budget;
  return `<div class="ruler${over ? ' over' : ''}" title="預算 ${fmt(budget)}／預估 ${fmt(s.est)}">
    <div class="fill f-quote" style="width:${pct(s.est)}"></div>
    <div class="fill f-invoice" style="width:${pct(s.inv)}"></div>
    <div class="fill f-paid" style="width:${pct(s.paid)}"></div>
    ${budget > 0 ? `<div class="budget-mark" style="left:calc(${pct(budget)} - 1px)"></div>` : ''}
  </div>`;
}
const legendHTML = `<div class="legend"><span><i style="background:var(--paid)"></i>已付款</span><span><i style="background:var(--invoice)"></i>已請款</span><span><i style="background:var(--quote)"></i>報價</span><span><i style="background:var(--ink);width:2px"></i>預算線</span></div>`;

/* ===== 畫面 ===== */
function render() {
  const a = document.activeElement, id = a?.id, pos = a?.selectionStart;
  view === 'detail' ? renderDetail() : renderList();
  if (id && $('#main').contains(document.getElementById(id))) {
    const el = document.getElementById(id); el.focus();
    try { if (pos != null) el.setSelectionRange(pos, pos); } catch {}
  }
}

/* 專案顯示用：連結通告時，名稱與狀態跟隨通告 */
const projName = p => { const n = p.noticeId && notices.get(p.noticeId); return n ? noticeTitle(n) : p.name; };
const projStatus = p => { const n = p.noticeId && notices.get(p.noticeId); return n ? (n.status === 'done' ? '已結案' : '進行中') : (p.status || '進行中'); };
const noticeSort = (a, b) => {
  const ao = a.noticeOrder, bo = b.noticeOrder;
  if (ao != null && bo != null) return ao - bo;
  if (ao != null) return -1; if (bo != null) return 1;
  return ts(b.updatedAt) - ts(a.updatedAt);
};

/* 列表項目：通告首頁的每一張通告 + 沒有連結通告的成本專案 */
function listItems() {
  const byNotice = new Map(projects.filter(p => p.noticeId).map(p => [p.noticeId, p]));
  const ns = [...notices.values()].sort(noticeSort);
  const items = [
    ...ns.filter(n => n.status !== 'done').map(n => ({ n, p: byNotice.get(n.id), status: '進行中' })),
    ...ns.filter(n => n.status === 'done').map(n => ({ n, p: byNotice.get(n.id), status: '已結案' })),
  ];
  projects.filter(p => !p.noticeId || !notices.has(p.noticeId))
    .sort((a, b) => ts(b.createdAt) - ts(a.createdAt))
    .forEach(p => items.push({ n: null, p, status: p.status || '進行中' }));
  return items;
}

function renderList() {
  const items = listItems();
  const activeP = items.filter(i => i.p && i.status !== '已結案').map(i => i.p);
  let tb = 0, te = 0, tp = 0;
  activeP.forEach(p => { const s = summarize(p.id); tb += Number(p.budget) || 0; te += s.est; tp += s.paid; });
  const shown = items.filter(i => listFilter === '全部' || i.status === listFilter);

  const rows = shown.map(({ n, p, status }) => {
    const h = n?.headerCfg || {};
    const place = n ? [h.venue, h.date].filter(Boolean).map(esc).join('｜') : '';
    const badge = `<span class="badge${status === '已結案' ? ' closed' : ''}">${status}</span>`;
    if (!p) {
      const cnt = Array.isArray(n.data) ? n.data.length : 0;
      return `<button class="prow" data-action="open-notice" data-nid="${esc(n.id)}">
        <div><div class="pname">${esc(noticeTitle(n))}${badge}</div><div class="psub">${place || '&nbsp;'}</div></div>
        <div><div class="psub">${cnt} 筆工作安排｜尚未開始記錄成本</div></div>
        <div class="pfig"><span class="btn sm">開始記錄成本</span></div>
      </button>`;
    }
    const s = summarize(p.id), budget = Number(p.budget) || 0, diff = budget - s.est, L = linkage(p);
    const sub = [];
    if (place) sub.push(place);
    sub.push(`${s.count} 筆成本`);
    if (L) {
      if (L.missing) sub.push(`<b style="color:#b26a00">未建立成本 ${L.missing} 項</b>`);
      if (L.changedEntries.length + L.orphans.length) sub.push(`<b style="color:var(--over)">通告異動 ${L.changedEntries.length + L.orphans.length} 筆</b>`);
    } else if (p.noticeId) sub.push('<b style="color:var(--over)">對應通告已刪除</b>');
    return `<button class="prow" data-action="open-project" data-id="${esc(p.id)}">
      <div>
        <div class="pname">${esc(projName(p))}${badge}</div>
        <div class="psub">${sub.join('｜')}</div>
      </div>
      <div>
        ${rulerHTML(budget, s)}
        <div class="pnums num"><span>已付 ${fmt(s.paid)}</span><span>預估 ${fmt(s.est)} / 預算 ${budget ? fmt(budget) : '未設定'}</span></div>
      </div>
      <div class="pfig num">
        ${budget ? `<strong class="${diff < 0 ? 'neg' : 'pos'}">${diff < 0 ? '超支 ' : ''}${fmt(Math.abs(diff))}</strong><small>${diff < 0 ? '超出預算' : '預算餘額'}</small>` : `<strong>${fmt(s.est)}</strong><small>預估成本</small>`}
      </div>
    </button>`;
  }).join('');

  $('#main').innerHTML = `
    <div class="overview num">
      <div><span>進行中專案</span><strong>${items.filter(i => i.status !== '已結案').length}</strong></div>
      <div><span>進行中總預算</span><strong>${fmt(tb)}</strong></div>
      <div><span>進行中預估成本</span><strong class="${te > tb && tb > 0 ? 'neg' : ''}">${fmt(te)}</strong></div>
      <div><span>進行中已付款</span><strong>${fmt(tp)}</strong></div>
    </div>
    <div class="bar-head">
      <h2>專案</h2>
      <div class="seg">${['進行中', '已結案', '全部'].map(f => `<button data-action="list-filter" data-f="${f}" class="${f === listFilter ? 'on' : ''}">${f}</button>`).join('')}</div>
      <button class="btn" data-action="export-excel">匯出 Excel</button>
      <button class="btn primary" data-action="new-project">新增專案</button>
    </div>
    <div class="plist">${rows || `<div class="empty">${items.length ? '這個分類沒有專案。' : '通告系統還沒有任何通告。'}</div>`}</div>
    ${shown.some(i => i.p) ? legendHTML : ''}`;
}

/* 點選尚未記錄成本的通告：自動建立對應的成本專案 */
let creatingFor = null;
async function openNotice(nid) {
  const exist = projects.find(p => p.noticeId === nid);
  if (exist) return openProject(exist.id);
  if (creatingFor) return;
  const n = notices.get(nid); if (!n) return;
  creatingFor = nid;
  try {
    const ref = await addDoc(collection(db, 'cost_projects'), {
      name: noticeTitle(n), status: n.status === 'done' ? '已結案' : '進行中', budget: 0, budgetByTrade: {},
      noticeId: nid, noticeRef: noticeTitle(n), note: '', ignoredSlots: [], createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    openProject(ref.id);
  } catch (err) { handleErr(err); }
  finally { creatingFor = null; }
}
function openProject(id) {
  currentProjectId = id; view = 'detail'; slotFilter = 'all'; entryFilter = { trade: '', status: '', q: '' };
  render(); window.scrollTo(0, 0);
}

function entryChip(e) {
  return `<button class="echip" data-action="edit-entry" data-id="${esc(e.id)}"><span>${esc(e.vendor || '未填廠商')}</span><b class="num">${fmt(taxed(e))}</b><span class="st st-${esc(e.status)}">${esc(e.status)}</span></button>`;
}

function slotSectionHTML(p, L) {
  const total = L.slots.length, linked = L.slots.filter(s => (L.bySlot[s.id] || []).length).length;
  const chg = L.changedEntries.length + L.orphans.length;
  const show = s => {
    const le = L.bySlot[s.id] || [];
    if (slotFilter === 'missing') return !le.length && !L.ignored.has(s.id);
    if (slotFilter === 'changed') return le.some(e => slotChanges(e, s).length);
    return true;
  };
  const order = tradeNames();
  const groups = {};
  L.slots.filter(show).forEach(s => (groups[s.type || '其他'] ||= []).push(s));
  const gkeys = Object.keys(groups).sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));

  const rows = gkeys.map(t => {
    const ss = groups[t];
    const sub = ss.reduce((a, s) => a + (L.bySlot[s.id] || []).reduce((x, e) => x + taxed(e), 0), 0);
    return `<div class="sgroup-h"><span class="dot" style="background:${tradeColor(t)}"></span>${esc(t)}<small>${ss.length} 項｜成本 ${fmt(sub)}</small></div>` +
      ss.map(s => {
        const le = L.bySlot[s.id] || [], ign = L.ignored.has(s.id), miss = !le.length && !ign;
        const desc = plain(s.desc) || '（無工作內容）';
        const changes = le.map(e => {
          const c = slotChanges(e, s); if (!c.length) return '';
          return `<div class="chg"><span>通告已異動（${esc(e.vendor || '未填廠商')}）：${esc(c.join('、'))}</span>
            <button class="btn sm" data-action="apply-change" data-id="${esc(e.id)}">套用到成本</button>
            <button class="btn ghost sm" data-action="ignore-change" data-id="${esc(e.id)}">保留原本</button></div>`;
        }).join('');
        return `<div class="srow${miss ? ' missing' : ''}${ign ? ' ignored' : ''}">
          <div class="sdate num">${esc(range(s))}${s.start ? `<br>${esc(s.start)}${s.end ? '–' + esc(s.end) : ''}` : ''}</div>
          <div>
            <div class="sdesc">${esc(desc.length > 120 ? desc.slice(0, 120) + '…' : desc)}</div>
            ${(s.assignees || []).length ? `<div class="smeta">負責：${esc(s.assignees.join('、'))}</div>` : ''}
            ${le.length ? `<div class="echips">${le.map(entryChip).join('')}</div>` : ''}
            ${miss ? '<div class="need">尚未建立成本</div>' : ''}${ign ? '<div class="smeta">已標記不計成本</div>' : ''}
            ${changes}
          </div>
          <div class="sacts">
            ${ign ? '' : `<button class="btn sm" data-action="entry-from-slot" data-slot="${esc(s.id)}">建立成本</button>`}
            ${le.length ? '' : `<button class="btn ghost sm" data-action="toggle-ignore" data-slot="${esc(s.id)}">${ign ? '恢復計算' : '不計成本'}</button>`}
          </div>
        </div>`;
      }).join('');
  }).join('');

  const orphanHTML = L.orphans.length && slotFilter !== 'missing' ? `<div class="sgroup-h"><span class="dot" style="background:var(--over)"></span>通告中已刪除的工項<small>${L.orphans.length} 筆成本</small></div>` +
    L.orphans.map(e => `<div class="srow"><div class="sdate num">${esc(e.slotSnap ? range(e.slotSnap) : '')}</div>
      <div><div class="sdesc">${esc(e.slotSnap?.desc || e.description || '')}</div><div class="echips">${entryChip(e)}</div>
      <div class="chg"><span>這個工項已從通告刪除，請確認這筆成本是否還需要。</span></div></div>
      <div class="sacts"><button class="btn sm" data-action="unlink-entry" data-id="${esc(e.id)}">保留並取消連結</button><button class="btn ghost sm" data-action="delete-entry" data-id="${esc(e.id)}">刪除成本</button></div></div>`).join('') : '';

  return `<h3 class="sec">通告工項對照</h3>
    <div class="link-sum">
      <button class="chip${slotFilter === 'all' ? ' on' : ''}" data-action="slot-filter" data-f="all">全部工項 <b class="num">${total}</b>（已建立 ${linked}）</button>
      <button class="chip warn${slotFilter === 'missing' ? ' on' : ''}" data-action="slot-filter" data-f="missing">未建立成本 <b class="num">${L.missing}</b></button>
      <button class="chip chg${slotFilter === 'changed' ? ' on' : ''}" data-action="slot-filter" data-f="changed">通告異動 <b class="num">${chg}</b></button>
      ${L.changedEntries.length > 1 ? `<button class="btn sm" data-action="apply-all">全部套用異動</button>` : ''}
    </div>
    <div class="slist">${rows + orphanHTML || `<div class="empty">${total ? '沒有符合條件的工項。' : '這張通告還沒有工作項目。'}</div>`}</div>`;
}

  $('#main').innerHTML = `

    <div class="dhead">
      <div class="t"><h2>${esc(projName(p))}<span class="badge${projStatus(p) === '已結案' ? ' closed' : ''}">${projStatus(p)}</span></h2>
        <div class="sub">${noticeLine}${p.note ? '｜' + esc(p.note) : ''}</div></div>
      <div class="acts">
        <button class="btn" data-action="export-excel" data-pid="${esc(p.id)}">匯出 Excel</button>
        <button class="btn" data-action="edit-project">編輯專案</button>
        <button class="btn danger" data-action="delete-project">刪除</button>
        <button class="btn primary" data-action="new-entry">新增成本項目</button>
      </div>
    </div>
    <div class="dsum">
      <div class="figs num">
        <div><span>預算</span><strong>${budget ? fmt(budget) : '未設定'}</strong></div>
        <div><span>預估成本</span><strong>${fmt(s.est)}</strong></div>
        <div><span>已請款</span><strong>${fmt(s.inv)}</strong></div>
        <div><span>已付款</span><strong>${fmt(s.paid)}</strong></div>
        <div><span>${remain < 0 ? '超出預算' : '預算餘額'}</span><strong class="${budget ? (remain < 0 ? 'neg' : 'pos') : ''}">${budget ? fmt(Math.abs(remain)) : '—'}</strong></div>
      </div>
      ${rulerHTML(budget, s)}
      ${legendHTML}
    </div>
    ${tradesUsed.length ? `<h3 class="sec">工種分析（含稅）</h3>
    <div class="tbl-wrap"><table class="num">
      <thead><tr><th>工種</th><th>預算</th><th>預估</th><th>已請款</th><th>已付款</th><th>預算 − 預估</th></tr></thead>
      <tbody>${tradeRows}
      <tr class="total"><td>合計</td><td>${sumBt ? fmt(sumBt) : '—'}</td><td>${fmt(s.est)}</td><td>${fmt(s.inv)}</td><td>${fmt(s.paid)}</td><td>${sumBt ? fmt(sumBt - s.est) : '—'}</td></tr>
      </tbody></table></div>` : ''}
    ${L ? slotSectionHTML(p, L) : ''}
    <h3 class="sec">全部成本項目</h3>
    <div class="filters">
      <select id="fTrade" aria-label="工種篩選"><option value="">全部工種</option>${tradeNames().map(t => `<option ${entryFilter.trade === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <select id="fStatus" aria-label="進度篩選"><option value="">全部進度</option>${['報價', '已請款', '已付款'].map(t => `<option ${entryFilter.status === t ? 'selected' : ''}>${t}</option>`).join('')}</select>

  $('#fTrade').onchange = e => { entryFilter.trade = e.target.value; renderEntries(); };

function renderEntries() {
  const p = projects.find(x => x.id === currentProjectId), L = linkage(p);
  const q = entryFilter.q.trim().toLowerCase();
  const list = entries
    .filter(e => e.projectId === currentProjectId)
    .filter(e => !entryFilter.trade || e.trade === entryFilter.trade)
    .filter(e => !entryFilter.status || e.status === entryFilter.status)
    .filter(e => !q || (e.vendor || '').toLowerCase().includes(q) || (e.description || '').toLowerCase().includes(q))
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || ts(b.createdAt) - ts(a.createdAt));
  const total = list.reduce((a, e) => a + taxed(e), 0);

  $('#elist').innerHTML = list.length ? list.map(e => {
    const link = safeLink(e.fileLink);
    let linkTag = '';
    if (L && e.slotId != null) {
      const s = L.slotById(e.slotId);
      linkTag = !s ? '<span class="tag chgtag">通告已刪除此工項</span>'
        : slotChanges(e, s).length ? '<span class="tag chgtag">通告有異動</span>' : '<span class="tag linked">已對應通告</span>';
    }
    return `<div class="erow">
      <div class="date num">${esc(e.date || '')}</div>
      <div class="main">
        <div class="vendor">${esc(e.vendor || '（未填廠商）')}</div>
        ${e.description ? `<div class="desc" title="${esc(e.description)}">${esc(e.description)}</div>` : ''}
        <div class="tags">
          <span class="tag trade" style="background:${tradeColor(e.trade)}">${esc(e.trade)}</span>
          <span class="st st-${esc(e.status)}">${esc(e.status)}</span>
          ${e.isOutsource ? '<span class="tag out">外包</span>' : ''}${linkTag}
        </div>
      </div>
      <div class="amt num"><strong>${fmt(taxed(e))}</strong><small>${e.taxIncluded ? '含稅' : '未稅 ' + fmt(e.amount)}</small></div>
      <div class="ops">
        ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">檔案</a>` : ''}
        <button class="btn ghost sm" data-action="edit-entry" data-id="${esc(e.id)}">編輯</button>
        <button class="btn ghost sm" data-action="delete-entry" data-id="${esc(e.id)}">刪除</button>
      </div>
    </div>`;
  }).join('') + `<div class="erow" style="background:#faf9fc"><div></div><div class="main"><strong>篩選結果 ${list.length} 筆</strong></div><div class="amt num"><strong>${fmt(total)}</strong><small>含稅合計</small></div><div></div></div>`
    : `<div class="empty">${entries.some(e => e.projectId === currentProjectId) ? '沒有符合篩選條件的項目。' : '這個專案還沒有成本項目。<br><button class="btn primary" data-action="new-entry">新增成本項目</button>'}</div>`;
}

async function saveProject() {
  const name = $('#pName').value.trim();
  if (!name) return toast('請輸入專案名稱', true);
  const byTrade = {};
  document.querySelectorAll('#pTradeGrid input').forEach(i => { const v = Number(i.value); if (v > 0) byTrade[i.dataset.trade] = v; });
  let budget = Number($('#pBudget').value) || 0;
  if (!budget) budget = Object.values(byTrade).reduce((a, b) => a + b, 0);
  const nid = $('#pNoticeId').value, n = notices.get(nid);
  const data = { name, status: $('#pStatus').value, budget, budgetByTrade: byTrade,
    noticeId: nid || null, noticeRef: n ? noticeTitle(n) : '', note: $('#pNote').value.trim(), updatedAt: serverTimestamp() };
  try {
    if (editingProjectId) await updateDoc(doc(db, 'cost_projects', editingProjectId), data);
    else {
      data.createdAt = serverTimestamp(); data.ignoredSlots = [];
      const ref = await addDoc(collection(db, 'cost_projects'), data);
      currentProjectId = ref.id; view = 'detail'; slotFilter = 'all';
    }
    $('#projectModal').classList.add('hidden');
    render(); toast('專案已儲存');
  } catch (err) { handleErr(err); }
}

async function deleteProject() {
  const p = projects.find(x => x.id === currentProjectId); if (!p) return;
  const its = entries.filter(e => e.projectId === p.id);
  if (!confirm(`確定刪除「${p.name}」？\n其中 ${its.length} 筆成本項目也會一併刪除，且無法復原。\n（工作通告本身不受影響）`)) return;

    await batch.commit();

async function saveEntry() {
  const raw = $('#eAmount').value.trim();
  const amount = Number(raw);
  if (raw === '' || !Number.isFinite(amount)) return toast('請輸入金額', true);
  const link = $('#eLink').value.trim();
  if (link && !safeLink(link)) return toast('檔案連結必須以 https:// 開頭', true);
  const L = linkage(projects.find(x => x.id === currentProjectId));
  const sv = $('#eSlot').value; let slotId = L && sv !== '' ? Number(sv) : null;
  const old = editingEntryId ? entries.find(x => x.id === editingEntryId) : null;
  let slotSnap = null;
  if (!L && old) { slotId = old.slotId ?? null; slotSnap = old.slotSnap ?? null; } // 通告暫時讀不到時，保留原本的連結
  else if (slotId != null) {
    // 沿用原本的快照，通告的後續異動才會繼續被標示；換了工項才重新記錄
    slotSnap = old && old.slotId === slotId && editingSlotSnap ? editingSlotSnap : snapOf(L.slotById(slotId) || {});
  }
  const data = {
    projectId: currentProjectId, date: $('#eDate').value || today(), trade: $('#eTrade').value,
    vendor: $('#eVendor').value.trim(), description: $('#eDesc').value.trim(), amount,

/* ===== 通告異動處理 ===== */
function changePayload(e, s) {
  const now = snapOf(s);
  const data = { trade: now.type, date: now.date, slotSnap: now, updatedAt: serverTimestamp() };
  // 成本說明若仍是當初從通告帶入的文字，就一起更新；若已自行修改則保留
  if ((e.description || '') === (e.slotSnap?.desc || '').slice(0, 100)) data.description = now.desc.slice(0, 100);
  return data;
}
async function applyChange(id) {
  const e = entries.find(x => x.id === id), L = linkage(projects.find(x => x.id === currentProjectId));
  const s = L?.slotById(e?.slotId); if (!s) return;
  try { await updateDoc(doc(db, 'cost_entries', id), changePayload(e, s)); toast('已套用通告異動'); }
  catch (err) { handleErr(err); }
}
async function ignoreChange(id) {
  const e = entries.find(x => x.id === id), L = linkage(projects.find(x => x.id === currentProjectId));
  const s = L?.slotById(e?.slotId); if (!s) return;
  try { await updateDoc(doc(db, 'cost_entries', id), { slotSnap: snapOf(s), updatedAt: serverTimestamp() }); toast('已保留原本的成本資料'); }
  catch (err) { handleErr(err); }
}
async function applyAll() {
  const L = linkage(projects.find(x => x.id === currentProjectId)); if (!L) return;
  if (!confirm(`將 ${L.changedEntries.length} 筆成本的工種與日期更新為通告目前的內容？`)) return;
  try {
    const batch = writeBatch(db);
    L.changedEntries.forEach(e => batch.update(doc(db, 'cost_entries', e.id), changePayload(e, L.slotById(e.slotId))));
    await batch.commit(); toast('已全部套用');
  } catch (err) { handleErr(err); }
}
async function unlinkEntry(id) {
  try { await updateDoc(doc(db, 'cost_entries', id), { slotId: null, slotSnap: null, updatedAt: serverTimestamp() }); toast('已取消連結，成本保留'); }
  catch (err) { handleErr(err); }
}


/* ===== 匯出 Excel ===== */
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return xlsxLoading ||= new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = () => { xlsxLoading = null; fail(new Error('Excel 元件載入失敗')); };
    document.head.appendChild(sc);
  });
}
const stamp = () => today().replace(/-/g, '');
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
function sheet(rows, widths) {
  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ '': '（無資料）' }]);
  if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
  return ws;
}
function projectRow(p) {
  const s = summarize(p.id), b = Number(p.budget) || 0, L = linkage(p), h = L?.n.headerCfg || {};
  return { '專案': projName(p), '狀態': projStatus(p), '地點': h.venue || '', '期間': h.date || '',
    '預算': b, '預估成本': s.est, '已請款': s.inv, '已付款': s.paid, '預算餘額': b ? b - s.est : '',
    '成本筆數': s.count, '未建立成本工項': L ? L.missing : '', '通告異動待確認': L ? L.changedEntries.length + L.orphans.length : '' };
}
function entryRows(ps) {
  const out = [];
  ps.forEach(p => {
    const L = linkage(p);
    entries.filter(e => e.projectId === p.id).sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(e => {
      const s = L && e.slotId != null ? L.slotById(e.slotId) : null;
      out.push({ '專案': projName(p), '日期': e.date || '', '工種': e.trade || '', '廠商': e.vendor || '', '項目內容': e.description || '',
        '金額': Number(e.amount) || 0, '稅別': e.taxIncluded ? '含稅' : '未稅', '含稅金額': taxed(e), '進度': e.status || '',
        '外包': e.isOutsource ? '是' : '', '對應通告工項': s ? `${range(s)} ${plain(s.desc).slice(0, 40)}` : (e.slotId != null ? '（通告已刪除）' : ''),
        '檔案連結': e.fileLink || '', '備註': e.note || '' });
    });
  });
  return out;
}
function tradeRows(ps) {
  const out = [];
  ps.forEach(p => {
    const s = summarize(p.id), bt = p.budgetByTrade || {};
    const ts_ = [...new Set([...tradeNames().filter(t => bt[t] || s.byTrade[t]), ...Object.keys(bt), ...Object.keys(s.byTrade)])];
    ts_.forEach(t => {
      const b = Number(bt[t]) || 0, x = s.byTrade[t] || { est: 0, inv: 0, paid: 0 };
      out.push({ '專案': projName(p), '工種': t, '預算': b || '', '預估': x.est, '已請款': x.inv, '已付款': x.paid, '預算−預估': b ? b - x.est : '' });
    });
  });
  return out;
}
function slotRows(p) {
  const L = linkage(p); if (!L) return null;
  return L.slots.map(s => {
    const le = L.bySlot[s.id] || [];
    return { '日期': range(s), '工種': s.type || '', '工作內容': plain(s.desc), '負責': (s.assignees || []).join('、'),
      '成本筆數': le.length, '成本金額（含稅）': le.reduce((a, e) => a + taxed(e), 0),
      '狀態': le.length ? (le.some(e => slotChanges(e, s).length) ? '通告有異動' : '已建立') : (L.ignored.has(s.id) ? '不計成本' : '未建立成本') };
  });
}
async function exportExcel(projectId) {
  try {
    await loadXLSX();
    const ps = projectId ? projects.filter(p => p.id === projectId)
      : listItems().filter(i => i.p && (listFilter === '全部' || i.status === listFilter)).map(i => i.p);
    if (!ps.length) return toast('目前沒有可匯出的專案', true);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheet(ps.map(projectRow), [28, 8, 22, 22, 12, 12, 12, 12, 12, 9, 13, 13]), '專案總表');
    XLSX.utils.book_append_sheet(wb, sheet(tradeRows(ps), [28, 12, 12, 12, 12, 12, 12]), '工種統計');
    XLSX.utils.book_append_sheet(wb, sheet(entryRows(ps), [28, 11, 10, 16, 30, 12, 6, 12, 8, 6, 30, 30, 20]), '成本明細');
    if (projectId) { const sr = slotRows(ps[0]); if (sr) XLSX.utils.book_append_sheet(wb, sheet(sr, [14, 10, 40, 16, 9, 14, 11]), '通告工項對照'); }
    const name = projectId ? `成本統計_${safeName(projName(ps[0]))}_${stamp()}.xlsx` : `成本統計_${listFilter}_${stamp()}.xlsx`;
    XLSX.writeFile(wb, name);
    toast('已匯出 Excel');
  } catch (err) { console.error(err); toast('匯出失敗：' + err.message, true); }
}

/* ===== 備份：匯出 / 匯入（合併模式，同通告系統） ===== */
const plainDoc = d => {
  const o = {};
  for (const [k, v] of Object.entries(d)) o[k] = v?.toDate ? v.toDate().toISOString() : v;
  return o;
};
function exportBackup() {
  const backup = { version: 1, system: 'cost-system', exportedAt: new Date().toISOString(),
    projects: projects.map(plainDoc), entries: entries.map(plainDoc) };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `成本統計系統備份_${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('已匯出備份');
}
async function commitInChunks(list, fn) {
  for (let i = 0; i < list.length; i += 400) {
    const batch = writeBatch(db);
    list.slice(i, i + 400).forEach(x => fn(batch, x));
    await batch.commit();
  }
}
async function importBackup(ev) {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  let b;
  try { b = JSON.parse(await file.text()); } catch { return alert('檔案格式錯誤，請選擇成本統計系統的備份 JSON 檔案'); }
  if (b?.system !== 'cost-system' || !Array.isArray(b.projects) || !Array.isArray(b.entries)) return alert('這不是成本統計系統的備份檔，無法匯入');
  const pIds = new Set(projects.map(p => p.id)), eIds = new Set(entries.map(e => e.id));
  const newP = b.projects.filter(p => p.id && !pIds.has(p.id));
  const newE = b.entries.filter(e => e.id && !eIds.has(e.id));
  if (!confirm(`即將匯入備份（合併模式）：\n\n✅ 新增專案 ${newP.length} 筆、成本項目 ${newE.length} 筆\n⏭ 系統中已存在的資料 → 保留不動\n\n確定要繼續嗎？`)) return;
  const clean = ({ id, createdAt, updatedAt, ...rest }) => ({ ...rest, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  try {
    // 先寫專案，再寫成本項目（資料庫規則要求成本項目對應的專案必須已存在）
    await commitInChunks(newP, (batch, p) => batch.set(doc(db, 'cost_projects', p.id), { budget: 0, ...clean(p), name: p.name || '未命名專案', budget: Number(p.budget) || 0 }));
    const allP = new Set([...pIds, ...newP.map(p => p.id)]);
    const okE = newE.filter(e => allP.has(e.projectId));
    await commitInChunks(okE, (batch, e) => batch.set(doc(db, 'cost_entries', e.id), clean(e)));
    alert(`匯入完成！\n✅ 新增專案 ${newP.length} 筆、成本項目 ${okE.length} 筆\n⏭ 跳過已存在的資料${newE.length - okE.length ? `\n⚠️ ${newE.length - okE.length} 筆成本找不到對應專案，未匯入` : ''}`);
  } catch (err) {
    console.error(err);
    alert('匯入過程發生錯誤，部分資料可能未完成，請檢查後重試（' + (err.code || err.message) + '）');
  }
}
$('#importFile').addEventListener('change', importBackup);

/* ===== 事件 ===== */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action;
  if (a === 'logout') { signOut(auth); return; }
  if (a === 'export-excel') exportExcel(b.dataset.pid || null);
  if (a === 'export-backup') exportBackup();
  if (a === 'import-backup') $('#importFile').click();
  if (a === 'list-filter') { listFilter = b.dataset.f; renderList(); }
  if (a === 'new-project') openProjectModal(null);
  if (a === 'open-project') openProject(b.dataset.id);
  if (a === 'open-notice') openNotice(b.dataset.nid);
  if (a === 'back') { view = 'list'; currentProjectId = null; renderList(); }
  if (a === 'edit-project') openProjectModal(projects.find(x => x.id === currentProjectId));
  if (a === 'delete-project') deleteProject();
  if (a === 'save-project') saveProject();
  if (a === 'new-entry') openEntryModal(null);
  if (a === 'edit-entry') openEntryModal(entries.find(x => x.id === b.dataset.id));
  if (a === 'delete-entry') deleteEntry(b.dataset.id);
  if (a === 'save-entry') saveEntry();
  if (a === 'slot-filter') { slotFilter = b.dataset.f; renderDetail(); }
  if (a === 'entry-from-slot') {
    const L = linkage(projects.find(x => x.id === currentProjectId));
    const s = L?.slotById(Number(b.dataset.slot)); if (s) openEntryModal(null, s);
  }
  if (a === 'toggle-ignore') toggleIgnore(Number(b.dataset.slot));
  if (a === 'apply-change') applyChange(b.dataset.id);
  if (a === 'ignore-change') ignoreChange(b.dataset.id);
  if (a === 'apply-all') applyAll();
  if (a === 'unlink-entry') unlinkEntry(b.dataset.id);
  if (a === 'close-modal') $('#' + b.dataset.target).classList.add('hidden');
});
/* 視窗刻意不因點擊背景或 ESC 關閉（避免中文輸入法衝突），與其他系統一致 */

</script>
